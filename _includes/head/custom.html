<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script>
  // Set the theme attribute immediately (before paint) so there's no flash.
  (function () {
    try {
      var saved = localStorage.getItem('site-theme');
      document.documentElement.setAttribute('data-theme', saved || 'light');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();

  // Build the floating toggle button once the DOM exists.
  document.addEventListener('DOMContentLoaded', function () {
    function current() {
      return document.documentElement.getAttribute('data-theme') || 'light';
    }

    var logoImg = document.querySelector('.site-logo img');
    function paintLogo() {
      if (!logoImg) return;
      logoImg.src = current() === 'dark'
        ? '{{ "/assets/images/logo-dark.png" | relative_url }}'
        : '{{ "/assets/images/logo-light.png" | relative_url }}';
    }
    paintLogo();

    var btn = document.createElement('button');
    btn.id = 'theme-toggle';
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Toggle light and dark theme');

    function paintIcon() {
      btn.textContent = current() === 'dark' ? '☀️' : '🌙';
    }
    paintIcon();

    btn.addEventListener('click', function () {
      var next = current() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('site-theme', next); } catch (e) {}
      paintIcon();
      paintLogo();
    });

    document.body.appendChild(btn);
  });
</script>
